
name: Build Battle Arena APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Extract Flutter project ZIP
      - name: Extract Flutter Project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter project ZIP not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          cp -a "$PROJECT_DIR"/. .

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Project extraction failed!"
            exit 1
          fi

          echo "Flutter project extracted successfully."

      # 5. Fix Gradle and Android plugin versions
      - name: Fix Android Gradle Configuration
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          if not settings.exists() or not wrapper.exists():
              raise SystemExit("ERROR: Android Gradle configuration files missing.")

          content = settings.read_text()

          versions = {
              "com.android.application": "8.11.1",
              "org.jetbrains.kotlin.android": "2.2.20",
              "com.google.gms.google-services": "4.4.2",
          }

          for plugin, version in versions.items():
              pattern = (
                  r'id\("' + re.escape(plugin) +
                  r'"\)\s+version\s+"[^"]+"'
                  r'(?:\s+apply\s+false)?'
              )

              replacement = (
                  f'id("{plugin}") version "{version}" apply false'
              )

              if re.search(pattern, content):
                  content = re.sub(pattern, replacement, content)
              elif plugin == "com.google.gms.google-services":
                  content = content.replace(
                      'plugins {',
                      'plugins {\n    ' + replacement,
                      1
                  )
              else:
                  raise SystemExit(
                      f"ERROR: Plugin declaration not found: {plugin}"
                  )

          settings.write_text(content)

          wrapper_content = wrapper.read_text()
          wrapper_content = re.sub(
              r'(?m)^distributionUrl=.*$',
              r'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip',
              wrapper_content
          )
          wrapper.write_text(wrapper_content)

          print("AGP: 8.11.1")
          print("Kotlin: 2.2.20")
          print("Google Services: 4.4.2")
          print("Gradle: 8.13")
          PY

      # 6. Configure Firebase
      - name: Setup Firebase Configuration
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          expected = "com.example.moeen.app"
          target = Path("android/app/google-services.json")

          candidates = [
              p for p in Path(".").rglob("google-services*.json")
              if ".git" not in p.parts
              and p != target
          ]

          if target.exists():
              candidates.insert(0, target)

          valid = None

          for file in candidates:
              try:
                  data = json.loads(file.read_text())
                  packages = [
                      c.get("client_info", {})
                       .get("android_client_info", {})
                       .get("package_name")
                      for c in data.get("client", [])
                  ]

                  if expected in packages:
                      valid = file
                      break
              except Exception:
                  continue

          if valid is None:
              print("ERROR: Matching Firebase configuration not found.")
              print("Required Android package:", expected)
              print("Do not manually edit package_name in JSON.")
              raise SystemExit(1)

          target.parent.mkdir(parents=True, exist_ok=True)

          if valid.resolve() != target.resolve():
              shutil.copy2(valid, target)

          print("Firebase configuration verified successfully.")
          PY

      # 7. Repair Android Manifest
      - name: Fix Android Manifest
        run: |
          mkdir -p android/app/src/main

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>

              <application
                  android:label="Battle Arena"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>

                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="high_importance_channel"/>

              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>

          </manifest>
          EOF

      # 8. Configure Android SDK and Desugaring
      - name: Configure Android App Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts missing")

          content = p.read_text()

          if "isCoreLibraryDesugaringEnabled" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(" not in content:
              content += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """

          if "namespace = " not in content:
              raise SystemExit("ERROR: Android namespace missing")

          if 'applicationId = "com.battlearena.app"' not in content:
              raise SystemExit("ERROR: Application ID is not com.battlearena.app")

          p.write_text(content)
          print("Android app Gradle configuration updated.")
          PY

      # 9. Install Flutter dependencies
      - name: Get Flutter Dependencies
        run: flutter pub get

      # 10. Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleArena-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
