name: Battle Arena Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Battle Arena Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Flutter setup
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Extract updated source ZIP
      - name: Extract Battle Arena source
        shell: bash
        run: |
          set -e

          ZIP_FILE="Battle-Arena-Startup-Fix-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Upload the updated source ZIP to the repository root."
            exit 1
          fi

          mkdir -p battle_arena_project
          unzip -q "$ZIP_FILE" -d battle_arena_project

          if [ ! -f battle_arena_project/pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found after extraction."
            exit 1
          fi

          echo "Source ZIP extracted successfully."

      # 5. Verify Firebase configuration
      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          PROJECT="battle_arena_project"
          FIREBASE_JSON="$PROJECT/android/app/google-services.json"

          if [ ! -f "$FIREBASE_JSON" ]; then
            echo "ERROR: android/app/google-services.json is missing."
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "battle_arena_project/android/app/google-services.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")
          apps = data.get("client", [])

          expected_package = "com.example.moeen.app"
          packages = [
              app.get("client_info", {})
                 .get("android_client_info", {})
                 .get("package_name")
              for app in apps
          ]

          print("Firebase project:", project_id)
          print("Registered Android packages:", packages)

          if project_id != "moeen-3fe9f":
              raise SystemExit("ERROR: Firebase project ID mismatch.")

          if expected_package not in packages:
              raise SystemExit("ERROR: Android package does not match Firebase.")

          print("Firebase configuration verified.")
          PY

      # 6. Verify Android package and MainActivity
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT="battle_arena_project"

          grep -q 'applicationId = "com.example.moeen.app"' \
            "$PROJECT/android/app/build.gradle.kts"

          grep -q 'namespace = "com.example.moeen.app"' \
            "$PROJECT/android/app/build.gradle.kts"

          test -f "$PROJECT/android/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/android/app/src/main/kotlin/com/example/moeen/app/MainActivity.kt"

          echo "Android package and MainActivity verified."

      # 7. Enable core library desugaring
      - name: Configure Android desugaring
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "battle_arena_project/android/app/build.gradle.kts"
          )

          text = path.read_text(encoding="utf-8")

          marker = "compileOptions {"

          if marker not in text:
              raise SystemExit("ERROR: compileOptions block not found.")

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  marker,
                  marker + "\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(" not in text:
              text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

          path.write_text(text, encoding="utf-8")
          print("Core library desugaring configured.")
          PY

      # 8. Flutter dependencies
      - name: Get Flutter dependencies
        working-directory: battle_arena_project
        run: flutter pub get

      # 9. Check project
      - name: Flutter analyze
        working-directory: battle_arena_project
        run: flutter analyze --no-pub
        continue-on-error: true

      # 10. Build release APK
      - name: Build Release APK
        working-directory: battle_arena_project
        run: flutter build apk --release

      # 11. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="battle_arena_project/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK build completed."

      # 12. Upload APK
      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: battle_arena_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
