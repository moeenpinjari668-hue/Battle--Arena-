
name: Build Battle Arena APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter Project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter project ZIP not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          cp -a "$PROJECT_DIR"/. .

          echo "Flutter project extracted successfully."

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          PACKAGE = "com.example.moeen.app"
          target = Path("android/app/google-services.json")

          candidates = list(Path(".").rglob("google-services*.json"))

          valid_file = None

          for file in candidates:
              if ".git" in file.parts:
                  continue

              if file == target:
                  continue

              try:
                  data = json.loads(file.read_text())

                  packages = [
                      client.get("client_info", {})
                      .get("android_client_info", {})
                      .get("package_name")
                      for client in data.get("client", [])
                  ]

                  if PACKAGE in packages:
                      valid_file = file
                      break

              except Exception:
                  continue

          if valid_file is None:
              raise SystemExit(
                  "ERROR: Firebase JSON for " + PACKAGE + " not found!"
              )

          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(valid_file, target)

          print("Firebase JSON verified successfully.")
          print("Package:", PACKAGE)
          PY

      - name: Configure Android Package and Desugaring
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          PACKAGE = "com.example.moeen.app"

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("ERROR: app/build.gradle.kts missing!")

          content = gradle.read_text()

          content, namespace_count = re.subn(
              r'namespace\s*=\s*"[^"]+"',
              f'namespace = "{PACKAGE}"',
              content,
              count=1
          )

          content, app_count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{PACKAGE}"',
              content,
              count=1
          )

          if namespace_count != 1 or app_count != 1:
              raise SystemExit("ERROR: Could not update namespace/applicationId!")

          if "isCoreLibraryDesugaringEnabled" not in content:
              if "compileOptions {" not in content:
                  raise SystemExit("ERROR: compileOptions block missing!")

              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if dependency not in content:
              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  content += (
                      "\n\ndependencies {\n    "
                      + dependency
                      + "\n}\n"
                  )

          gradle.write_text(content)

          # Update MainActivity package declaration
          activities = list(
              Path("android/app/src/main").rglob("MainActivity.kt")
          )

          if not activities:
              raise SystemExit("ERROR: MainActivity.kt not found!")

          for activity in activities:
              source = activity.read_text()

              source, count = re.subn(
                  r'(?m)^package\s+[\w.]+',
                  f'package {PACKAGE}',
                  source,
                  count=1
              )

              if count == 0:
                  source = f"package {PACKAGE}\n\n" + source

              activity.write_text(source)

          print("Android package configured:", PACKAGE)
          print("Desugaring configured.")
          PY

      - name: Verify Gradle Wrapper
        run: |
          echo "Checking original Gradle version..."
          cat android/gradle/wrapper/gradle-wrapper.properties

          grep -q "gradle-9.3.1-all.zip" \
            android/gradle/wrapper/gradle-wrapper.properties || {
              echo "ERROR: Expected Gradle 9.3.1 in project ZIP!"
              exit 1
            }

          echo "Original Gradle 9.3.1 preserved."

      - name: Verify App Assets
        run: |
          test -f assets/app_logo.png || {
            echo "ERROR: App logo missing!"
            exit 1
          }

          echo "App logo verified."

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleArena-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
