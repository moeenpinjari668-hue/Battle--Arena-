name: Build Battle Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract and locate Battle Arena source
        id: project
        run: |
          set -e
          if [ -f "Battle-Arena-Startup-Fix-Source-Updated.zip" ]; then
            ZIP_FILE="Battle-Arena-Startup-Fix-Source-Updated.zip"
          elif [ -f "Battle-Arena-Startup-Fix-Source.zip" ]; then
            ZIP_FILE="Battle-Arena-Startup-Fix-Source.zip"
          else
            echo "ERROR: Battle Arena source ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Using source ZIP: $ZIP_FILE"
          mkdir -p battle_arena_project
          unzip -q "$ZIP_FILE" -d battle_arena_project
          PUBSPEC=$(find battle_arena_project -type f -name pubspec.yaml -print -quit)
          test -n "$PUBSPEC" || { echo "ERROR: pubspec.yaml not found in source ZIP"; exit 1; }
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project located at: $PROJECT_DIR"

      - name: Configure Android compatibility and permanent signing
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Ensure Android Gradle Plugin version is compatible.
          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()
          pattern = r'(id\("com\.android\.application"\)\s+version\s+")([^"]+)(")'
          content, count = re.subn(pattern, r'\g<1>9.1.1\3', content, count=1)
          if count != 1:
              raise SystemExit("ERROR: Android application plugin version not found")
          settings.write_text(content)

          # Keep required Gradle compatibility flags without duplicates.
          props = Path("android/gradle.properties")
          content = props.read_text() if props.exists() else ""
          lines = [line for line in content.splitlines()
                   if not line.strip().startswith("android.newDsl=")
                   and not line.strip().startswith("android.builtInKotlin=")]
          lines.extend(["android.newDsl=false", "android.builtInKotlin=false"])
          props.write_text("\n".join(lines) + "\n")

          # Enable Java API desugaring required by some Firebase/plugin dependencies.
          app_gradle = Path("android/app/build.gradle.kts")
          content = app_gradle.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in content:
              target = "targetCompatibility = JavaVersion.VERSION_17"
              if target not in content:
                  raise SystemExit("ERROR: Java 17 targetCompatibility not found")
              content = content.replace(target, target + "\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "coreLibraryDesugaring(" not in content:
              content += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'

          # Load the permanent upload key from android/key.properties.
          if not content.startswith("import java.util.Properties"):
              content = "import java.util.Properties\n\n" + content
          if "val keystoreProperties = Properties()" not in content:
              marker = "}\n\nandroid {"
              setup = '''}

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          require(keystorePropertiesFile.exists()) { "Android signing key.properties is missing" }
          keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }

          android {'''
              if marker not in content:
                  raise SystemExit("ERROR: Could not locate plugins/android boundary in app Gradle file")
              content = content.replace(marker, setup, 1)

          if "create(\"release\")" not in content:
              marker = "    buildTypes {"
              signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
              if marker not in content:
                  raise SystemExit("ERROR: Could not locate buildTypes block")
              content = content.replace(marker, signing + marker, 1)

          content, count = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              content,
              count=1
          )
          if count != 1 and 'signingConfig = signingConfigs.getByName("release")' not in content:
              raise SystemExit("ERROR: Could not configure release signing")
          app_gradle.write_text(content)
          print("Android compatibility and permanent release signing configured.")
          PY

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is empty"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ERROR: ANDROID_KEY_ALIAS secret is empty"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ERROR: ANDROID_KEY_PASSWORD secret is empty"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF2

      - name: Verify Firebase configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          test -f android/app/google-services.json || { echo "ERROR: Firebase google-services.json missing"; exit 1; }
          python3 - <<'PY'
          import json
          with open("android/app/google-services.json") as f:
              data = json.load(f)
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                      for c in data.get("client", [])]
          print("Firebase package names:", packages)
          if "com.battlearena.app" not in packages:
              raise SystemExit("ERROR: Firebase package com.battlearena.app not found")
          PY

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter clean

      - name: Get Flutter dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ steps.project.outputs.project_dir }}
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK package and signature
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -Fx "com.battlearena.app"

      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

          
