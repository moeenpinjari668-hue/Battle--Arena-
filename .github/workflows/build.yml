
name: Build Battle Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Flutter setup
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Extract the single project ZIP
      - name: Extract Battle Arena project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob
          import os
          import shutil
          import zipfile

          workspace = os.environ["GITHUB_WORKSPACE"]
          zips = glob.glob(os.path.join(workspace, "*.zip"))

          if len(zips) != 1:
              raise SystemExit(
                  f"ERROR: Repository root mein exactly 1 ZIP hona chahiye. "
                  f"Abhi {len(zips)} ZIP mile: {zips}"
              )

          archive = zips[0]
          extract_dir = os.path.join(workspace, "_extracted")
          project_dir = os.path.join(workspace, "battle_arena_project")

          shutil.rmtree(extract_dir, ignore_errors=True)
          shutil.rmtree(project_dir, ignore_errors=True)
          os.makedirs(extract_dir, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP corrupt hai: {bad}")
              z.extractall(extract_dir)

          candidates = []
          for root, dirs, files in os.walk(extract_dir):
              dirs[:] = [d for d in dirs if d not in [".git", "build"]]
              if "pubspec.yaml" in files:
                  candidates.append(root)

          if len(candidates) != 1:
              raise SystemExit(
                  f"ERROR: Ek Flutter project root expected tha, "
                  f"lekin {len(candidates)} mile: {candidates}"
              )

          shutil.copytree(
              candidates[0],
              project_dir,
              ignore=shutil.ignore_patterns(".git", ".dart_tool", "build")
          )

          print("Flutter project extracted:", project_dir)
          PY

      # 5. Validate Android Firebase configuration
      - name: Verify Firebase Android configuration
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json || {
            echo "ERROR: android/app/google-services.json missing"
            exit 1
          }

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")
          clients = data.get("client", [])

          expected_package = "com.example.moeen.app"
          matches = []

          for client in clients:
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if package_name == expected_package:
                  matches.append(client)

          if project_id != "moeen-3fe9f":
              raise SystemExit(
                  f"ERROR: Unexpected Firebase project: {project_id}"
              )

          if not matches:
              raise SystemExit(
                  "ERROR: Firebase JSON mein expected Android package "
                  f"{expected_package} nahi mila."
              )

          print("Firebase project and Android package verified.")
          PY

      # 6. Verify app package and launcher icon
      - name: Verify Android project files
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          test -f lib/main.dart
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/app_logo.png

          grep -q 'com.example.moeen.app' \
            android/app/build.gradle.kts

          grep -q 'Firebase.initializeApp' lib/main.dart

          echo "Required project files verified."

      # 7. Android Gradle compatibility
      - name: Configure Android Gradle
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")

          text, count = re.subn(
              r'(id\("com\.android\.application"\)\s+version\s+")([^"]+)(")',
              r'\g<1>9.1.1\3',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Android Gradle Plugin version line not found."
              )

          settings.write_text(text, encoding="utf-8")

          props = Path("android/gradle.properties")
          lines = (
              props.read_text(encoding="utf-8").splitlines()
              if props.exists() else []
          )

          values = {
              "android.useAndroidX": "true",
              "android.newDsl": "false",
              "android.builtInKotlin": "false",
          }

          for key, value in values.items():
              lines = [
                  line for line in lines
                  if not line.strip().startswith(key + "=")
              ]
              lines.append(f"{key}={value}")

          props.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Gradle compatibility settings applied.")
          PY

          grep -q 'gradle-9.3.1' \
            android/gradle/wrapper/gradle-wrapper.properties

      # 8. Flutter dependencies
      - name: Get Flutter packages
        working-directory: battle_arena_project
        run: flutter pub get

      # 9. Analyze Dart code
      - name: Check Dart code
        working-directory: battle_arena_project
        run: flutter analyze --no-pub
        continue-on-error: true

      # 10. Build release APK
      - name: Build Battle Arena APK
        working-directory: battle_arena_project
        run: |
          flutter build apk --release

      # 11. Verify APK exists
      - name: Verify APK
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK missing or empty."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      # 12. Upload APK artifact
      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: battle_arena_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
