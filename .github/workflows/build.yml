
name: Build Battle Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Battle Arena Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Extract project ZIP
      - name: Extract Battle Arena project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob
          import os
          import shutil
          import zipfile

          workspace = os.environ["GITHUB_WORKSPACE"]
          zips = glob.glob(os.path.join(workspace, "*.zip"))

          if len(zips) != 1:
              raise SystemExit(
                  f"ERROR: Root folder mein exactly 1 ZIP hona chahiye. "
                  f"Found: {len(zips)}"
              )

          archive = zips[0]
          extract_dir = os.path.join(workspace, "_extracted")
          project_dir = os.path.join(workspace, "battle_arena_project")

          shutil.rmtree(extract_dir, ignore_errors=True)
          shutil.rmtree(project_dir, ignore_errors=True)
          os.makedirs(extract_dir, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP file: {bad}")

              for member in z.infolist():
                  target = os.path.realpath(
                      os.path.join(extract_dir, member.filename)
                  )
                  if not target.startswith(
                      os.path.realpath(extract_dir) + os.sep
                  ):
                      raise SystemExit("Unsafe ZIP path detected.")
              z.extractall(extract_dir)

          candidates = []

          for root, dirs, files in os.walk(extract_dir):
              dirs[:] = [
                  d for d in dirs
                  if d not in [".git", ".dart_tool", "build"]
              ]

              if "pubspec.yaml" in files:
                  candidates.append(root)

          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected one Flutter project, found: {candidates}"
              )

          shutil.copytree(
              candidates[0],
              project_dir,
              ignore=shutil.ignore_patterns(
                  ".git", ".dart_tool", "build"
              )
          )

          print("Project extracted successfully.")
          PY

      # 5. Verify Firebase configuration
      - name: Verify Firebase configuration
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/google-services.json

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")
          clients = data.get("client", [])

          expected_package = "com.example.moeen.app"

          matching = []

          for client in clients:
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name == expected_package:
                  matching.append(client)

          if project_id != "moeen-3fe9f":
              raise SystemExit(
                  f"Wrong Firebase project: {project_id}"
              )

          if not matching:
              raise SystemExit(
                  "Firebase Android package ID does not match."
              )

          print("Firebase configuration verified.")
          PY

      # 6. Verify project files
      - name: Verify project files
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/app_logo.png

          grep -q 'com.example.moeen.app' \
            android/app/build.gradle.kts

          echo "Project files verified."

      # 7. Configure Android Gradle compatibility
      - name: Configure Android Gradle
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text(encoding="utf-8")

          text, count = re.subn(
              r'(id\("com\.android\.application"\)\s+version\s+")([^"]+)(")',
              r'\g<1>9.1.1\3',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Android Gradle Plugin declaration not found."
              )

          settings.write_text(text, encoding="utf-8")

          props = Path("android/gradle.properties")

          lines = (
              props.read_text(encoding="utf-8").splitlines()
              if props.exists() else []
          )

          values = {
              "android.useAndroidX": "true",
              "android.newDsl": "false",
              "android.builtInKotlin": "false",
          }

          for key, value in values.items():
              lines = [
                  line for line in lines
                  if not line.strip().startswith(key + "=")
              ]
              lines.append(f"{key}={value}")

          props.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Gradle compatibility configured.")
          PY

          grep -q 'gradle-9.3.1' \
            android/gradle/wrapper/gradle-wrapper.properties

      # 8. Fix core library desugaring
      - name: Enable core library desugaring
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # Enable desugaring in compileOptions
          if "isCoreLibraryDesugaringEnabled" not in text:
              pattern = r'(?m)^(\s*)compileOptions\s*\{'

              text, count = re.subn(
                  pattern,
                  lambda m: (
                      m.group(0)
                      + "\n"
                      + m.group(1)
                      + "    isCoreLibraryDesugaringEnabled = true"
                  ),
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: compileOptions block not found."
                  )

          # Add required dependency
          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5")'
          )

          if "desugar_jdk_libs" not in text:
              match = re.search(
                  r'(?m)^dependencies\s*\{',
                  text
              )

              if match:
                  text = (
                      text[:match.end()]
                      + "\n    " + dependency
                      + text[match.end():]
                  )
              else:
                  marker = re.search(
                      r'(?m)^kotlin\s*\{',
                      text
                  )

                  if not marker:
                      raise SystemExit(
                          "ERROR: Cannot locate dependencies insertion point."
                      )

                  text = (
                      text[:marker.start()]
                      + "dependencies {\n    "
                      + dependency
                      + "\n}\n\n"
                      + text[marker.start():]
                  )

          path.write_text(text, encoding="utf-8")

          print("Core library desugaring enabled.")
          PY

          grep -q 'isCoreLibraryDesugaringEnabled = true' \
            android/app/build.gradle.kts

          grep -q 'desugar_jdk_libs' \
            android/app/build.gradle.kts

      # 9. Flutter dependencies
      - name: Get Flutter packages
        working-directory: battle_arena_project
        run: flutter pub get

      # 10. Dart analysis
      - name: Analyze Flutter code
        working-directory: battle_arena_project
        run: flutter analyze --no-pub
        continue-on-error: true

      # 11. Build release APK
      - name: Build Battle Arena APK
        working-directory: battle_arena_project
        run: flutter build apk --release

      # 12. Verify APK
      - name: Verify generated APK
        working-directory: battle_arena_project
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      # 13. Upload APK
      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: battle_arena_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
