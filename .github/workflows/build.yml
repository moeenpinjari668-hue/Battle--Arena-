
name: Battle Arena Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Battle Arena Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Battle Arena source
        shell: bash
        run: |
          set -e
          ZIP_FILE="Battle-Arena-Startup-Fix-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          mkdir -p battle_arena_project
          unzip -q "$ZIP_FILE" -d battle_arena_project

          test -f battle_arena_project/pubspec.yaml

      - name: Fix Android Gradle Plugin version
        shell: bash
        run: |
          set -e

          FILE="battle_arena_project/android/settings.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("battle_arena_project/android/settings.gradle.kts")
          text = p.read_text(encoding="utf-8")

          pattern = r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")'
          updated, count = re.subn(
              pattern,
              r'\g<1>9.1.1\g<2>',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("ERROR: Could not update AGP version.")

          p.write_text(updated, encoding="utf-8")
          print("Android Gradle Plugin updated to 9.1.1")
          PY

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -e

          FILE="battle_arena_project/android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: google-services.json missing."
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "battle_arena_project/android/app/google-services.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          project_id = data.get("project_info", {}).get("project_id")
          clients = data.get("client", [])

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in clients
          ]

          print("Firebase project:", project_id)
          print("Android packages:", packages)

          if project_id != "moeen-3fe9f":
              raise SystemExit("Firebase project ID mismatch.")

          if "com.example.moeen.app" not in packages:
              raise SystemExit("Firebase Android package mismatch.")

          print("Firebase configuration verified.")
          PY

      - name: Verify Android package
        shell: bash
        run: |
          set -e

          PROJECT="battle_arena_project"

          grep -q 'applicationId = "com.example.moeen.app"' \
            "$PROJECT/android/app/build.gradle.kts"

          grep -q 'namespace = "com.example.moeen.app"' \
            "$PROJECT/android/app/build.gradle.kts"

          test -f "$PROJECT/android/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT/android/app/src/main/kotlin/com/example/moeen/app/MainActivity.kt"

          echo "Android package verified."

      - name: Configure Android compatibility and desugaring
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          project = Path("battle_arena_project/android")
          app_file = project / "app/build.gradle.kts"

          text = app_file.read_text(encoding="utf-8")

          marker = "compileOptions {"

          if marker not in text:
              raise SystemExit("compileOptions block not found.")

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  marker,
                  marker + "\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(" not in text:
              text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

          app_file.write_text(text, encoding="utf-8")

          gradle_properties = project / "gradle.properties"
          existing = (
              gradle_properties.read_text(encoding="utf-8")
              if gradle_properties.exists() else ""
          )

          flags = [
              "android.newDsl=false",
              "android.builtInKotlin=false"
          ]

          for flag in flags:
              key = flag.split("=")[0]
              if key not in existing:
                  existing += "\n" + flag

          gradle_properties.write_text(existing.strip() + "\n", encoding="utf-8")

          print("Desugaring and Android compatibility configured.")
          PY

      - name: Get Flutter dependencies
        working-directory: battle_arena_project
        run: flutter pub get

      - name: Flutter analyze
        working-directory: battle_arena_project
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build Release APK
        working-directory: battle_arena_project
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="battle_arena_project/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: battle_arena_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
