name: Build Battle Arena APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract Project ZIP
        run: |
          for f in *.zip; do mv "$f" app.zip; done
          unzip -o app.zip
          if [ ! -f "pubspec.yaml" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r $SUBDIR/* .
            fi
          fi

      - name: Setup Firebase Config
        run: |
          python3 -c "
          import os, shutil, sys
          found = None
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.startswith('google-services') and file.endswith('.json'):
                      found = os.path.join(root, file)
                      break
              if found:
                  break
          if found:
              print(f'✅ Found file at: {found}')
              os.makedirs('android/app', exist_ok=True)
              shutil.copy(found, 'android/app/google-services.json')
              print('✅ Copied successfully to android/app/google-services.json')
          else:
              print('❌ ERROR: google-services.json is completely MISSING!')
              sys.exit(1)
          "

      - name: Overwrite Clean Android Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              
              <application
                  android:label="Battle Arena"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="high_importance_channel" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF
          echo "✅ Replaced AndroidManifest.xml with a clean, valid XML version."

      - name: Patch Android Config for Desugaring & SDKs
        run: |
          python3 -c "
          import re, os
          
          kts_path = 'android/app/build.gradle.kts'
          if os.path.exists(kts_path):
              with open(kts_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'minSdk\s*=\s*.*', 'minSdk = 23', content)
              content = re.sub(r'compileSdk\s*=\s*.*', 'compileSdk = 36', content)
              content = re.sub(r'targetSdk\s*=\s*.*', 'targetSdk = 34', content)
              if 'multiDexEnabled' not in content:
                  content = content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled = true')
              if 'isCoreLibraryDesugaringEnabled' not in content:
                  content = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', content)
              if 'coreLibraryDesugaring' not in content:
                  content += '\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'
              with open(kts_path, 'w') as f:
                  f.write(content)
              print('Patched build.gradle.kts with Desugaring!')
          "

      # 🔥 YEH NAYA STEP HAI: Saare plugins ko AGP 9 ke liye fix karega
      - name: Patch Plugins for AGP 9 (Built-in Kotlin)
        run: |
          python3 -c "
          import os, re, glob
          
          home = os.path.expanduser('~')
          # Pub cache mein saare build.gradle files dhoondho
          pattern = os.path.join(home, '.pub-cache', 'hosted', 'pub.dev', '*', 'android', 'build.gradle')
          files = glob.glob(pattern)
          
          for file in files:
              try:
                  with open(file, 'r') as f:
                      content = f.read()
                  
                  modified = False
                  
                  # 1. kotlin-android apply line ko hatao (single/double quotes, with/without spaces)
                  new_content = re.sub(r\"apply\s+plugin\s*:\s*['\\\"]kotlin-android['\\\"]\s*\n?\", '', content)
                  new_content = re.sub(r\"apply\s+plugin\s*:\s*['\\\"]org\.jetbrains\.kotlin\.android['\\\"]\s*\n?\", '', new_content)
                  new_content = re.sub(r\"id\s*\(?['\\\"]kotlin-android['\\\"]\)?\s*\n?\", '', new_content)
                  
                  if new_content != content:
                      content = new_content
                      modified = True
                      print(f'Removed kotlin-android plugin from: {file}')
                  
                  # 2. compileSdk ensure karo
                  if 'compileSdk' not in content:
                      if 'compileSdkVersion' in content:
                          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdk 36', content)
                          modified = True
                      else:
                          # android { } block ke andar add karo
                          content = re.sub(r'android\s*\{', 'android {\n    compileSdk 36', content)
                          modified = True
                  
                  if modified:
                      with open(file, 'w') as f:
                          f.write(content)
                      print(f'✅ Patched: {file}')
              except Exception as e:
                  print(f'⚠️ Could not patch {file}: {e}')
          "

      - name: Setup App Launcher Icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp assets/app_logo.png "$d/ic_launcher.png"
              cp assets/app_logo.png "$d/ic_launcher_round.png" 2>/dev/null || true
            fi
          done
          echo "App launcher icon set to assets/app_logo.png"

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleArena-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
