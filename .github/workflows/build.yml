
name: Build Battle Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Battle Arena source ZIP
        run: |
          if [ ! -f "Battle-Arena-Startup-Fix-Source.zip" ]; then
            echo "ERROR: Source ZIP not found in repository root."
            exit 1
          fi

          mkdir -p battle_arena_project
          unzip -q Battle-Arena-Startup-Fix-Source.zip -d battle_arena_project

          if [ ! -f "battle_arena_project/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found after extraction."
            echo "Check the ZIP folder structure."
            find battle_arena_project -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Configure Android compatibility
        working-directory: battle_arena_project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Force compatible Android Gradle properties.
          props = Path("android/gradle.properties")
          content = props.read_text() if props.exists() else ""

          lines = [
              line for line in content.splitlines()
              if not line.strip().startswith("android.newDsl=")
              and not line.strip().startswith("android.builtInKotlin=")
          ]

          lines.extend([
              "android.newDsl=false",
              "android.builtInKotlin=false"
          ])

          props.write_text("\n".join(lines) + "\n")

          # Enable Java core library desugaring.
          app_gradle = Path("android/app/build.gradle.kts")
          content = app_gradle.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in content:
              target = "targetCompatibility = JavaVersion.VERSION_17"
              if target not in content:
                  raise SystemExit("Could not find Java 17 compileOptions in app/build.gradle.kts")

              content = content.replace(
                  target,
                  target + "\n            isCoreLibraryDesugaringEnabled = true",
                  1
              )

          # Add desugaring dependency.
          if "coreLibraryDesugaring(" not in content:
              dependency = '''
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }

          '''
              if "flutter {" in content:
                  content = content.replace("flutter {", dependency + "flutter {", 1)
              else:
                  content += "\n" + dependency

          app_gradle.write_text(content)

          print("Android Gradle compatibility settings applied.")
          print(props.read_text())
          PY

      - name: Verify Firebase configuration
        working-directory: battle_arena_project
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json is missing."
            exit 1
          fi

          python3 - <<'PY'
          import json

          path = "android/app/google-services.json"
          with open(path) as f:
              data = json.load(f)

          clients = data.get("client", [])
          package_names = []

          for client in clients:
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if package_name:
                  package_names.append(package_name)

          print("Firebase Android package names:", package_names)

          if "com.example.moeen.app" not in package_names:
              raise SystemExit("ERROR: Expected Firebase package com.example.moeen.app not found.")
          PY

      - name: Flutter clean
        working-directory: battle_arena_project
        run: flutter clean

      - name: Get Flutter dependencies
        working-directory: battle_arena_project
        run: flutter pub get

      - name: Flutter analyze
        working-directory: battle_arena_project
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: battle_arena_project
        run: flutter build apk --release

      - name: Upload Battle Arena APK
        uses: actions/upload-artifact@v4
        with:
          name: Battle-Arena-Release-APK
          path: battle_arena_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
